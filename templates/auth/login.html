<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Entrar | Lucas Tavares</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/sistema.css') }}"
    >

    <style>
        .login-logo {
            display: block;
            width: min(240px, 78%);
            height: auto;
            margin: 0 auto 1.75rem;
            object-fit: contain;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 3.25rem;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.75rem;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border: 0;
            border-radius: 0.5rem;
            background: transparent;
            color: #6c757d;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .password-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #001633;
        }

        .login-security-note {
            margin-top: 1.25rem;
            color: #6c757d;
            font-size: 0.82rem;
            text-align: center;
        }
    </style>
</head>

<body class="login-page">

<div class="login-overlay"></div>

<div class="login-card">

    <img
        src="{{ url_for('static', filename='img/logo_lucas.png') }}"
        alt="Lucas Tavares Advocacia e Consultoria Jurídica"
        class="login-logo"
    >

    <div class="login-heading">

        <h1>
            Acesso ao sistema
        </h1>

        <p>
            Entre com suas credenciais
        </p>

    </div>

    {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% if mensagens %}

            {% for categoria, mensagem in mensagens %}

                <div
                    class="alert alert-{{ categoria }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ mensagem }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Fechar"
                    ></button>
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form
        method="POST"
        novalidate
    >

        <div class="mb-3">

            <label
                for="email"
                class="form-label"
            >
                E-mail
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                value="{{ email or '' }}"
                autocomplete="email"
                required
                autofocus
            >

        </div>

        <div class="mb-4">

            <label
                for="senha"
                class="form-label"
            >
                Senha
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    class="form-control"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="alternarSenha"
                    aria-label="Mostrar senha"
                    title="Mostrar senha"
                >
                    👁
                </button>

            </div>

        </div>

        <button
            class="btn btn-gold w-100"
            type="submit"
        >
            Entrar
        </button>

    </form>

    <div class="login-security-note">
        Acesso restrito aos usuários autorizados do escritório.
    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
></script>

<script>
    const campoSenha = document.getElementById("senha");
    const botaoAlternarSenha = document.getElementById("alternarSenha");

    botaoAlternarSenha.addEventListener("click", function () {
        const senhaVisivel = campoSenha.type === "text";

        campoSenha.type = senhaVisivel
            ? "password"
            : "text";

        botaoAlternarSenha.textContent = senhaVisivel
            ? "👁"
            : "🙈";

        botaoAlternarSenha.setAttribute(
            "aria-label",
            senhaVisivel
                ? "Mostrar senha"
                : "Ocultar senha"
        );

        botaoAlternarSenha.setAttribute(
            "title",
            senhaVisivel
                ? "Mostrar senha"
                : "Ocultar senha"
        );
    });
</script>

</body>
</html>
